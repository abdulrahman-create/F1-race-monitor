# ---------------------------------------------------------------------------
# F1 Race Replay — Dokploy + Traefik compose file
#
# Deploy this app on a Dokploy VPS with Traefik as the reverse proxy.
# The GUI (noVNC) is exposed at https://<your-domain> and the telemetry /
# VNC TCP endpoints are exposed on their ports.
#
# Dokploy notes:
#   - The container MUST join the external `dokploy-network` so Traefik can
#     route to it.
#   - Do NOT set `container_name` in Dokploy (breaks logs/metrics).
#   - Traefik routes the single WEB port (6080). Telemetry (9999) & raw VNC
#     (5900) are published TCP ports reachable directly on the host.
# ---------------------------------------------------------------------------

services:
  replay:
    build: .
    image: f1-race-replay:latest
    # no container_name here — Dokploy needs it unset
    restart: always
    environment:
      # Virtual display + resolution (software OpenGL via Mesa)
      - DISPLAY=:99
      - RESOLUTION=1440x900x24
      - NOVNC_PORT=6080
    # For Dokploy: the web port (6080) is only EXPOSED (not published to the
    # host) so Traefik can route to it via the dokploy-network. TCP endpoints
    # (telemetry 9999, raw VNC 5900) are PUBLISHED ports reachable directly
    # at <server-ip>:<port>. Remove 5900 if you only use the noVNC browser UI.
    expose:
      - "6080"
    ports:
      - "9999:9999"
      - "5900:5900"
    volumes:
      - fastf1_cache:/app/.fastf1-cache
      - computed_data:/app/computed_data
    command: ["python", "main.py"]
    shm_size: "2gb"
    networks:
      - dokploy-network
    # Option B: domains are managed in the Dokploy UI (Domains tab), which
    # generates the Traefik routing + Let's Encrypt certificate for your
    # domain automatically. So NO manual Traefik labels are set here.
    #
    # In the Dokploy UI set:  Domain = your domain (e.g. f1.waniehomebaker.my)
    #                         Service = replay
    #                         Port    = 6080
    #
    # If noVNC's "Connect" button fails over HTTPS, add a WebSocket middleware
    # in Dokploy's advanced domain settings for path "/websockify" (noVNC
    # proxies the VNC stream over WebSocket there).

volumes:
  fastf1_cache:
  computed_data:

networks:
  dokploy-network:
    external: true